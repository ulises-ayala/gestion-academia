name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://academy_ci:academy_ci@localhost:5432/academy_ci?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: academy_ci
          POSTGRES_USER: academy_ci
          POSTGRES_PASSWORD: academy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academy_ci -d academy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
