services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: academy
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
    ports: ["5432:5432"]
    volumes: ["academy_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  academy_postgres_data:
