<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 760" width="1340" height="760" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Arquitectura de Carmesí</title>
  <desc id="d">El equipo de la academia usa el panel Next.js, que consume por HTTP/JSON la API NestJS; la API accede con Prisma a PostgreSQL en Neon. Los contratos y el esquema de base viven en paquetes compartidos, y GitHub Actions corre la integración continua, el despliegue en Render y el respaldo de la base.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c8781"/>
    </marker>
  </defs>

  <rect width="1340" height="760" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1339" height="759" rx="14" fill="none" stroke="#ddd9d4"/>

  <text x="40" y="48" font-size="22" font-weight="700" fill="#7d1d35">Carmesí</text>
  <text x="130" y="48" font-size="16" fill="#6f6a64">Arquitectura · monolito modular en un monorepo TypeScript</text>

  <!-- Equipo -->
  <rect x="40" y="90" width="200" height="200" rx="10" fill="#f8f7f5" stroke="#ddd9d4"/>
  <text x="60" y="120" font-size="16" font-weight="700" fill="#1c1917">Equipo de la academia</text>
  <text x="60" y="141" font-size="13" fill="#6f6a64">Tres niveles de acceso</text>
  <g font-size="13" fill="#1c1917">
    <rect x="60" y="158" width="160" height="30" rx="15" fill="#ffffff" stroke="#ddd9d4"/>
    <text x="140" y="178" text-anchor="middle">Admisión</text>
    <rect x="60" y="196" width="160" height="30" rx="15" fill="#ffffff" stroke="#ddd9d4"/>
    <text x="140" y="216" text-anchor="middle">Administración</text>
    <rect x="60" y="234" width="160" height="30" rx="15" fill="#ffffff" stroke="#ddd9d4"/>
    <text x="140" y="254" text-anchor="middle">Dirección</text>
  </g>

  <!-- Panel -->
  <rect x="340" y="90" width="250" height="200" rx="10" fill="#f5e9ed" stroke="#7d1d35" stroke-width="1.5"/>
  <text x="360" y="120" font-size="16" font-weight="700" fill="#7d1d35">apps/admin-web</text>
  <text x="360" y="141" font-size="13" fill="#57534e">Next.js 15 · React 19</text>
  <g font-size="13" fill="#1c1917">
    <text x="360" y="174">Panel administrativo (App Router)</text>
    <text x="360" y="198">CSS con tokens, claro y oscuro</text>
    <text x="360" y="222">Lógica pura testeada en lib/</text>
    <text x="360" y="246">Nunca accede a la base</text>
  </g>

  <!-- WhatsApp -->
  <rect x="340" y="340" width="250" height="80" rx="10" fill="#e8f3ec" stroke="#b9d7c4"/>
  <text x="360" y="370" font-size="15" font-weight="700" fill="#21643e">WhatsApp</text>
  <text x="360" y="393" font-size="13" fill="#1c1917">Enlaces wa.me con el texto armado</text>
  <line x1="465" y1="290" x2="465" y2="338" stroke="#8c8781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-soft)"/>

  <!-- API -->
  <rect x="700" y="90" width="330" height="440" rx="10" fill="#f5e9ed" stroke="#7d1d35" stroke-width="1.5"/>
  <text x="716" y="120" font-size="16" font-weight="700" fill="#7d1d35">apps/api</text>
  <text x="716" y="141" font-size="13" fill="#57534e">NestJS 11 · REST versionada en /api/v1</text>

  <rect x="716" y="156" width="298" height="32" rx="6" fill="#7d1d35"/>
  <text x="865" y="177" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Guards: sesión + permisos por endpoint</text>

  <text x="716" y="212" font-size="12" font-weight="600" fill="#57534e" letter-spacing="0.6">MÓDULOS DE NEGOCIO</text>
  <g font-size="12.5" fill="#1c1917" text-anchor="middle">
    <g>
      <rect x="716" y="222" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="763" y="239">auth</text>
      <rect x="818" y="222" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="865" y="239">users</text>
      <rect x="920" y="222" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="967" y="239">audit</text>
    </g>
    <g>
      <rect x="716" y="254" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="763" y="271">students</text>
      <rect x="818" y="254" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="865" y="271">leads</text>
      <rect x="920" y="254" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="967" y="271">messages</text>
    </g>
    <g>
      <rect x="716" y="286" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="763" y="303">offering</text>
      <rect x="818" y="286" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="865" y="303">enrollments</text>
      <rect x="920" y="286" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="967" y="303">attendances</text>
    </g>
    <g>
      <rect x="716" y="318" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="763" y="335">billing</text>
      <rect x="818" y="318" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="865" y="335">cash</text>
      <rect x="920" y="318" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="967" y="335">settlements</text>
    </g>
    <g>
      <rect x="716" y="350" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="763" y="367">reports</text>
      <rect x="818" y="350" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="865" y="367">dashboard</text>
      <rect x="920" y="350" width="94" height="26" rx="6" fill="#ffffff" stroke="#eedce2"/><text x="967" y="367">teachers</text>
    </g>
  </g>

  <text x="716" y="402" font-size="12" font-weight="600" fill="#57534e" letter-spacing="0.6">CAPAS DE CADA MÓDULO</text>
  <g font-size="11.5" fill="#1c1917" text-anchor="middle">
    <rect x="716" y="412" width="71" height="28" rx="6" fill="#ffffff" stroke="#8c8781"/><text x="751.5" y="430">presentation</text>
    <rect x="791.5" y="412" width="71" height="28" rx="6" fill="#ffffff" stroke="#8c8781"/><text x="827" y="430">application</text>
    <rect x="867" y="412" width="71" height="28" rx="6" fill="#ffffff" stroke="#8c8781"/><text x="902.5" y="430">domain</text>
    <rect x="942.5" y="412" width="71.5" height="28" rx="6" fill="#ffffff" stroke="#8c8781"/><text x="978" y="430">infrastructure</text>
  </g>
  <g font-size="13" fill="#1c1917">
    <text x="716" y="470">Finanzas append-only: nada se reescribe</text>
    <text x="716" y="492">Transacciones serializables con reintento</text>
    <text x="716" y="514">Dinero en Decimal, nunca float</text>
  </g>

  <!-- Base -->
  <rect x="1130" y="90" width="170" height="200" rx="10" fill="#e8f1f6" stroke="#b9d1df" stroke-width="1.5"/>
  <text x="1148" y="120" font-size="16" font-weight="700" fill="#245b78">PostgreSQL 16</text>
  <text x="1148" y="141" font-size="13" fill="#57534e">Alojada en Neon</text>
  <g font-size="13" fill="#1c1917">
    <text x="1148" y="174">Instantes en UTC</text>
    <text x="1148" y="198">Día de negocio en</text>
    <text x="1148" y="216">Buenos Aires</text>
    <text x="1148" y="246">43 migraciones</text>
  </g>

  <rect x="1130" y="340" width="170" height="80" rx="10" fill="#f8f7f5" stroke="#ddd9d4"/>
  <text x="1148" y="370" font-size="15" font-weight="700" fill="#1c1917">Respaldo cifrado</text>
  <text x="1148" y="393" font-size="13" fill="#57534e">Cada 3 días</text>
  <line x1="1215" y1="290" x2="1215" y2="338" stroke="#8c8781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-soft)"/>

  <!-- Flechas principales -->
  <g stroke="#57534e" stroke-width="2" fill="none">
    <line x1="240" y1="190" x2="338" y2="190" marker-end="url(#arrow)"/>
    <line x1="590" y1="190" x2="698" y2="190" marker-end="url(#arrow)"/>
    <line x1="1030" y1="190" x2="1128" y2="190" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12.5" fill="#57534e" text-anchor="middle">
    <text x="290" y="180">navegador</text>
    <text x="645" y="180" font-weight="600">HTTP/JSON</text>
    <text x="645" y="210">cookie HttpOnly</text>
    <text x="1080" y="180" font-weight="600">Prisma 6</text>
  </g>

  <!-- Paquetes compartidos -->
  <rect x="340" y="570" width="330" height="76" rx="10" fill="#f8f7f5" stroke="#ddd9d4"/>
  <text x="358" y="600" font-size="15" font-weight="700" fill="#1c1917">packages/contracts</text>
  <text x="358" y="624" font-size="13" fill="#57534e">DTO públicos que comparten el panel y la API</text>

  <rect x="700" y="570" width="600" height="76" rx="10" fill="#f8f7f5" stroke="#ddd9d4"/>
  <text x="718" y="600" font-size="15" font-weight="700" fill="#1c1917">packages/database</text>
  <text x="718" y="624" font-size="13" fill="#57534e">Esquema Prisma, migraciones escritas a mano con su test y seeds de datos ficticios</text>

  <rect x="40" y="570" width="270" height="76" rx="10" fill="#f8f7f5" stroke="#ddd9d4"/>
  <text x="58" y="600" font-size="15" font-weight="700" fill="#1c1917">docs</text>
  <text x="58" y="624" font-size="13" fill="#57534e">Más de 260 decisiones de negocio</text>

  <!-- CI -->
  <rect x="40" y="676" width="1260" height="48" rx="10" fill="#1c1917"/>
  <text x="60" y="706" font-size="14" font-weight="700" fill="#ffffff">GitHub Actions</text>
  <text x="182" y="706" font-size="13.5" fill="#ece9e5">formato · lint · typecheck · migraciones desde cero · tests · build   →   deploy automático en Render desde main</text>
</svg>
